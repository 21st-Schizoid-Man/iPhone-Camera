name: iOS build and image tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iPhone Simulator
        run: >-
          xcodebuild -project MomentCamera.xcodeproj -scheme MomentCamera
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Choose an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())['devices']
          candidates = [device for runtime, group in devices.items() if '.iOS-' in runtime
                        for device in group if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SIMULATOR_UDID=' + candidates[-1]['udid'] + '\n')
          PY
      - name: Test full-resolution film rendering and image orientation
        run: >-
          xcodebuild -project MomentCamera.xcodeproj -scheme MomentCamera
          -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -derivedDataPath build/DerivedData -resultBundlePath build/CameraTests.xcresult
          CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-test-results
          path: build/CameraTests.xcresult
          if-no-files-found: ignore
