name: iOS build and image tests

on:
  push:
    paths:
      - 'MomentCamera/**'
      - 'MomentCameraTests/**'
      - 'MomentCamera.xcodeproj/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'MomentCamera/**'
      - 'MomentCameraTests/**'
      - 'MomentCamera.xcodeproj/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iPhone Simulator
        run: >-
          xcodebuild -project MomentCamera.xcodeproj -scheme MomentCamera
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Choose an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())['devices']
          candidates = [device for runtime, group in devices.items() if '.iOS-' in runtime
                        for device in group if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SIMULATOR_UDID=' + candidates[-1]['udid'] + '\n')
          PY
      - name: Test library persistence, film rendering and frame/watermark export
        run: |
          set -o pipefail
          xcodebuild -project MomentCamera.xcodeproj -scheme MomentCamera \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/CameraTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/test.log
      - name: Publish failing compiler and test diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('build/test.log')
          if log.exists():
              matches = [line for line in log.read_text(errors='replace').splitlines()
                         if re.search(r'error:|XCTAssert.*failed|Assertion Failure|Test Case .*failed', line)]
              for line in matches[:20]:
                  escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=iOS test diagnostic::' + escaped[:1800])
          PY
      - name: Publish XCTest counts and reject an empty test run
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = subprocess.run(['xcrun', 'xcresulttool', 'get', 'test-results', 'summary',
                                   '--path', 'build/CameraTests.xcresult'], capture_output=True, text=True)
          if result.returncode:
              message = result.stderr.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=XCTest summary unavailable::' + message[:1500])
              raise SystemExit(result.returncode)
          summary = json.loads(result.stdout)
          Path('build/test-summary.json').write_text(result.stdout)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## XCTest results\n\n```json\n' + json.dumps(summary, ensure_ascii=False, indent=2) + '\n```\n')
          counts = {name: summary.get(name, 0) for name in ('totalTestCount', 'passedTests', 'failedTests', 'skippedTests')}
          print('::notice title=XCTest counts::' + json.dumps(counts))
          for failure in summary.get('testFailures', [])[:15]:
              message = json.dumps(failure, ensure_ascii=False).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=XCTest failure::' + message[:1800])
          if counts['passedTests'] + counts['failedTests'] <= 0:
              raise SystemExit('No executed tests were reported')
          if counts['failedTests'] > 0:
              raise SystemExit('XCTest reported failures')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-test-results
          path: |
            build/CameraTests.xcresult
            build/test-summary.json
            build/test.log
          if-no-files-found: ignore
